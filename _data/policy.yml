- id: eu-grants
  title: "The effect of EU grants on Hungarian firms"
  title_hu: "Az uniós támogatások hatása a magyar cégekre"
  # DRAFT wording, not yet approved by Gábor
  intro: >-
    How do EU grants change the firms that receive them? We link EU-funded support to the
    balance sheets of Hungarian firms and compare supported firms with similar firms that were
    not supported. Joint work with Balázs Muraközy, Dániel Barabás and Basile Grassi.
  intro_hu: >-
    Hogyan változnak az uniós támogatást kapó cégek? Az uniós forrásból finanszírozott
    támogatásokat összekapcsoljuk a magyar cégek mérlegadataival, és a támogatott cégeket
    hasonló, támogatást nem kapott cégekkel vetjük össze. Közös munka Muraközy Balázzsal,
    Barabás Dániellel és Basile Grassival.
  coming: "Working paper coming soon."
  coming_hu: "A műhelytanulmány hamarosan elkészül."

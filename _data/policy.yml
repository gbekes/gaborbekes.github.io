  en:
    title: "Where will growth come from? Reallocation, the missing factor in Hungary"
    abstract: >-
      Hungary needs growth that does not burden the budget. We ask whether part of it can come
      from workers and capital moving from less to more productive firms. Using balance sheets of
      all Hungarian firms for 2004–2023 and CompNet data for Poland and Central and Eastern Europe,
      we run three exercises. By the late 2010s productivity gaps between firms in the same
      industry were wider in Hungary than in Poland and the region on every measure we have, and in
      Hungary they did not narrow after 2019. The contribution of resources moving between firms to
      productivity growth fell by almost half after 2013, from 1.6 to 0.8 percentage points a year.
      About 60% of this fall comes from foreign-owned firms; among domestic firms reallocation
      slowed by about a quarter. At the same time, the model's efficiency gap, the output lost to
      misallocation, widened among domestic firms at least as much as overall, most in
      construction and utilities. A standard model suggests that returning to the allocation of
      2004–2010 would lift the level of output by 1–2% of GDP, a one-off but lasting gain; over
      five years, 0.2–0.4 percentage points of extra growth a year. Rules that apply equally to all firms, sector measures that are temporary, open entry and
      exit, and transparent support could mobilise this reserve.
    keywords: "productivity, reallocation, misallocation, firm dynamics, Hungary"
  hu:
    title: "Honnan jöhet a növekedés? A reallokáció, a hiányzó tényező Magyarországon"
    abstract: >-
      Magyarországnak olyan növekedés kell, amely nem terheli a költségvetést. Azt vizsgáljuk,
      származhat-e ennek egy része abból, hogy a munka és a tőke a kevésbé termelékeny cégektől a
      termelékenyebbekhez áramlik. Az összes magyar cég 2004–2023-as mérlegadatai, valamint a
      Lengyelországra és a közép- és kelet-európai régióra vonatkozó CompNet-adatok alapján három
      elemzést végzünk. A 2010-es évek végére az azonos ágazatban működő cégek közötti
      termelékenységi különbségek minden rendelkezésünkre álló mérőszám szerint nagyobbak voltak
      Magyarországon, mint Lengyelországban és a régióban, és Magyarországon 2019 után sem
      szűkültek. A cégek közötti erőforrás-átáramlás hozzájárulása a termelékenység növekedéséhez
      2013 után csaknem a felére esett, évi 1,6-ről 0,8 százalékpontra. A csökkenés mintegy 60%-a
      a külföldi tulajdonú cégekből jön; a hazai cégeknél a reallokáció mintegy negyedével
      lassult. Eközben a modell szerinti hatékonysági rés, vagyis a rossz allokáció miatt elvesző
      kibocsátás, a hazai cégeknél legalább annyival nőtt, mint összességében, leginkább az
      építőiparban és a közműveknél. Egy standard modell szerint a 2004–2010-es allokációhoz
      visszatérve a kibocsátás szintje a GDP 1–2%-ával nőne; ez egyszeri, de tartós nyereség, öt év
      alatt évi 0,2–0,4 százalékpont többletnövekedés. Ezt a tartalékot minden cégre egyformán érvényes szabályok,
      átmeneti ágazati intézkedések, nyitott piacra lépés és kilépés, valamint átlátható támogatási
      döntések mozgósíthatnák.
    keywords: "termelékenység, reallokáció, rossz allokáció, cégdinamika, Magyarország"

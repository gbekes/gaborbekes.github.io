<figure class="yt-embed">
  <div class="yt-frame"><iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | escape }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <figcaption><strong>{{ include.title }}</strong><br><span class="yt-meta">{{ include.meta }}</span></figcaption>
</figure>
